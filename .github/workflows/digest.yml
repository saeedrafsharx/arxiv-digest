name: Generate arXiv Digest

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Generate digest
        run: |
          uv run arxd search "neural network" --markdown results.md

      - name: Update README
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md")
          digest = Path("results.md")

          content = readme.read_text(encoding="utf-8")
          new_digest = digest.read_text(encoding="utf-8")

          updated = re.sub(
              r"<!-- DIGEST_START -->.*?<!-- DIGEST_END -->",
              f"<!-- DIGEST_START -->\n\n{new_digest}\n\n<!-- DIGEST_END -->",
              content,
              flags=re.DOTALL,
          )

          readme.write_text(updated, encoding="utf-8")
          PY

      - name: Commit updated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md results.md

          git diff --cached --quiet || \
          git commit -m "Update daily arXiv digest"

          git push